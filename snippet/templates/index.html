<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Developer Code Snippet Vault</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f7f6; margin: 0; padding: 30px; color: #222; }
        h2 { text-align: center; margin-bottom: 25px; }
        .layout { display: flex; gap: 25px; max-width: 1150px; margin: auto; }
        .panel { background: white; padding: 22px; border-radius: 8px; box-shadow: 0 3px 8px rgba(0,0,0,0.1); }
        .left { flex: 1; height: fit-content; }
        .right { flex: 2; }
        label { display: block; font-weight: bold; margin-top: 12px; font-size: 14px; color: #444; }
        input, select, textarea { width: 100%; padding: 9px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-family: inherit; }
        textarea { font-family: Consolas, monospace; height: 160px; resize: vertical; }
        .btn-save { width: 100%; padding: 11px; margin-top: 16px; background: #007bff; color: white; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; }
        .btn-save:hover { background: #0056b3; }
        .stats-bar { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 18px; }
        .stat-pill { background: #e9ecef; padding: 6px 12px; border-radius: 20px; font-size: 13px; font-weight: bold; }
        .search-row { display: flex; gap: 10px; margin-bottom: 20px; }
        .search-row input { flex: 2; margin-top: 0; }
        .search-row select { flex: 1; margin-top: 0; }
        .snippet-card { border: 1px solid #ddd; border-radius: 6px; padding: 15px; margin-bottom: 15px; background: #fafafa; }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .badge { background: #007bff; color: white; padding: 3px 8px; border-radius: 4px; font-size: 12px; margin-right: 6px; }
        .tag { background: #6c757d; color: white; padding: 3px 8px; border-radius: 4px; font-size: 12px; }
        pre { background: #1e1e1e; color: #dcdcdc; padding: 12px; border-radius: 5px; overflow-x: auto; font-size: 13px; margin: 0; }
        .btn-sm { padding: 5px 10px; border: none; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: bold; }
        .btn-copy { background: #28a745; color: white; margin-right: 5px; }
        .btn-del { background: #dc3545; color: white; }
    </style>
</head>
<body>

<h2>Developer Code Snippet & Algorithm Vault</h2>

<div class="layout">
    <!-- LEFT PANEL: ADD SNIPPET -->
    <div class="panel left">
        <h3 style="margin-top:0;">Add New Snippet</h3>
        
        <label>Snippet Title</label>
        <input type="text" id="titleInput" placeholder="e.g., Dijkstra Shortest Path">

        <label>Language</label>
        <select id="langInput">
            <option value="cpp">C++</option>
            <option value="python">Python</option>
            <option value="csharp">C#</option>
            <option value="sql">SQL</option>
            <option value="js">JavaScript</option>
        </select>

        <label>Category Tag</label>
        <input type="text" id="tagInput" placeholder="e.g., DSA, Game Dev, API">

        <label>Code Block</label>
        <textarea id="codeInput" placeholder="Paste your reusable code here..."></textarea>

        <button class="btn-save" onclick="saveSnippet()">Save to Vault</button>
    </div>

    <!-- RIGHT PANEL: STATS, SEARCH & SNIPPETS -->
    <div class="panel right">
        <div class="stats-bar" id="statsBar"></div>

        <div class="search-row">
            <input type="text" id="searchInput" placeholder="Search by title, tag, or code keyword..." onkeyup="loadSnippets()">
            <select id="filterLang" onchange="loadSnippets()">
                <option value="all">All Languages</option>
                <option value="cpp">C++</option>
                <option value="python">Python</option>
                <option value="csharp">C#</option>
                <option value="sql">SQL</option>
                <option value="js">JavaScript</option>
            </select>
        </div>

        <div id="snippetsList"></div>
    </div>
</div>

<script>
    let codeStore = {};

    function escapeHtml(text) {
        return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    async function saveSnippet() {
        const payload = {
            title: document.getElementById('titleInput').value,
            lang_id: document.getElementById('langInput').value,
            tag: document.getElementById('tagInput').value || 'General',
            code_body: document.getElementById('codeInput').value
        };

        const res = await fetch('/api/snippets', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });

        if (res.ok) {
            document.getElementById('titleInput').value = '';
            document.getElementById('tagInput').value = '';
            document.getElementById('codeInput').value = '';
            loadSnippets();
        } else {
            alert("Please enter both a Title and Code.");
        }
    }

    async function deleteSnippet(id) {
        await fetch(`/api/snippets/${id}`, { method: 'DELETE' });
        loadSnippets();
    }

    function copyCode(id, btn) {
        navigator.clipboard.writeText(codeStore[id]);
        btn.innerText = "Copied!";
        setTimeout(() => btn.innerText = "Copy", 1500);
    }

    async function loadSnippets() {
        const q = document.getElementById('searchInput').value;
        const lang = document.getElementById('filterLang').value;

        const res = await fetch(`/api/snippets?q=${encodeURIComponent(q)}&lang=${lang}`);
        const data = await res.json();

        // Render SQL GROUP BY language counts
        document.getElementById('statsBar').innerHTML = data.stats.map(s =>
            `<span class="stat-pill">${s.lang_name}: ${s.snippet_count}</span>`
        ).join('');

        // Render Snippet Cards
        codeStore = {};
        document.getElementById('snippetsList').innerHTML = data.snippets.map(s => {
            codeStore[s.snippet_id] = s.code_body;
            return `
                <div class="snippet-card">
                    <div class="card-header">
                        <div>
                            <span class="badge">${s.lang_name}</span>
                            <span class="tag">${escapeHtml(s.tag)}</span>
                            <strong style="margin-left:8px;">${escapeHtml(s.title)}</strong>
                        </div>
                        <div>
                            <button class="btn-sm btn-copy" onclick="copyCode(${s.snippet_id}, this)">Copy</button>
                            <button class="btn-sm btn-del" onclick="deleteSnippet(${s.snippet_id})">Delete</button>
                        </div>
                    </div>
                    <pre><code>${escapeHtml(s.code_body)}</code></pre>
                </div>
            `;
        }).join('');
    }

    loadSnippets();
</script>
</body>
</html>
